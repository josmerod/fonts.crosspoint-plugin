# A tag `vX.Y.Z` publishes the GitHub Release the CrossPoint Plugin Hub pins
# installs to. The tag must equal manifest.json -> version, or the release is
# refused — the hub rejects (and would silently not publish) a mismatch.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test tests/test_plugin.mjs
      - name: Tag must match manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p 'require("./fonts.crosspoint-plugin/manifest.json").version')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match manifest version $VERSION"
            exit 1
          fi
          echo "Releasing $VERSION"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Fonts v${GITHUB_REF_NAME#v}" \
            --notes "CrossPoint plugin. Install from Home → Plugins (Plugin Hub) or copy \`fonts.crosspoint-plugin/\` to \`/.crosspoint/plugins/fonts/\` on the SD card." \
            --verify-tag
